name: Release APK to Telegram

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: true

# Explicit bash runs every script with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Device tests need an emulator, so CI only compiles them to keep them from breaking unnoticed.
      - name: Compile device tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # Android lint and detekt; detekt fails only on findings not in config/detekt/baseline.xml.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run lint and detekt
        run: ./gradlew lintDebug detekt

      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 7

  build:
    needs: [test, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes the version tag after a successful release.
    permissions:
      contents: write
    steps:
      # Full history and tags are needed to pick the next version and list the changes since the last one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Recreate the git-ignored signing files from repository secrets.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is not set}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is not set}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is not set}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is not set}"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Each successful build gets the next patch of the major.minor line set in app/build.gradle.kts,
      # e.g. 1.2 -> v1.2.1, v1.2.2, ... The tag is pushed only after the release is sent, so failed builds reuse the number.
      - name: Compute version
        run: |
          base=$(./gradlew -q :app:printVersionName)
          # grep finds nothing before the first patch release of a version; that is not an error.
          last_patch=$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          version="${base}.$(( ${last_patch:-0} + 1 ))"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "Building version $version"

      # The +100 offset keeps CI builds above the hand-set versionCode (3), so each one installs as an update.
      - name: Build release APK
        run: |
          version_code=$((GITHUB_RUN_NUMBER + 100))
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          ./gradlew assembleRelease -PversionCode="$version_code" -PversionName="$VERSION_NAME"

      - name: Name and verify APK
        id: apk
        run: |
          name="tracker-v${VERSION_NAME}-${GITHUB_SHA::7}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$name" | grep -v -i "public key"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### 📦 $name"
            echo "- versionName: $VERSION_NAME"
            echo "- versionCode: $VERSION_CODE"
            echo "- size: $(du -h "$name" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      # Lists the non-merge commit subjects since the previous release tag.
      - name: Collect changes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..HEAD"
            header="Changes since $previous:"
          else
            range="HEAD"
            header="Changes:"
          fi
          total=$(git rev-list --no-merges --count "$range")
          changes=$(git log --no-merges --format='• %s' -n 20 "$range")
          if [ "$total" -gt 20 ]; then
            changes=$(printf '%s\n…and %d more' "$changes" "$((total - 20))")
          fi
          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            printf '%s\n%s\n' "$header" "${changes:-• No code changes}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          : "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN secret is not set}"
          : "${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID secret is not set}"
          # A UTF-8 locale makes the substring count characters, so multi-byte text is never cut mid-character.
          export LC_ALL=C.UTF-8
          caption=$(printf '📦 Tracker v%s\n%s\n\n%s' "$VERSION_NAME" "$APK" "$CHANGELOG")
          curl --fail-with-body -sS --retry 3 \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"$APK" \
            --form-string caption="${caption:0:1000}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null

      - name: Tag release
        run: |
          git tag "v$VERSION_NAME"
          git push origin "v$VERSION_NAME"

      - name: Clean up signing files
        if: always()
        run: rm -f release.jks keystore.properties

  notify-failure:
    needs: [test, build]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS --retry 3 \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="❌ Tracker build failed (${GITHUB_SHA::7}): $run_url" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
