name: Release APK to Telegram

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Recreate the git-ignored signing files from repository secrets.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="tracker-v${version}-${GITHUB_SHA::7}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          caption=$(printf '%s\n\n%s' "${{ steps.apk.outputs.path }}" "${COMMIT_MESSAGE:-Manual build}" | head -c 1000)
          curl --fail-with-body -sS \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"${{ steps.apk.outputs.path }}" \
            --form-string caption="$caption" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null

      - name: Clean up signing files
        if: always()
        run: rm -f release.jks keystore.properties
