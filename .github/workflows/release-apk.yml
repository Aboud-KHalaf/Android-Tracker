name: Release APK to Telegram

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: true

# Explicit bash runs every script with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Recreate the git-ignored signing files from repository secrets.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is not set}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is not set}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is not set}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is not set}"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # The +100 offset keeps CI builds above the hand-set versionCode (3), so each one installs as an update.
      - name: Build release APK
        run: |
          version_code=$((GITHUB_RUN_NUMBER + 100))
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          ./gradlew assembleRelease -PversionCode="$version_code"

      - name: Name and verify APK
        id: apk
        run: |
          version=$(./gradlew -q :app:printVersionName)
          name="tracker-v${version}-${GITHUB_SHA::7}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$name" | grep -v -i "public key"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### 📦 $name"
            echo "- versionCode: $VERSION_CODE"
            echo "- size: $(du -h "$name" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          : "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN secret is not set}"
          : "${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID secret is not set}"
          # A UTF-8 locale makes the substring count characters, so multi-byte text is never cut mid-character.
          export LC_ALL=C.UTF-8
          caption=$(printf '%s\n\n%s' "$APK" "${COMMIT_MESSAGE:-Manual build}")
          curl --fail-with-body -sS --retry 3 \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"$APK" \
            --form-string caption="${caption:0:1000}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null

      - name: Clean up signing files
        if: always()
        run: rm -f release.jks keystore.properties

  notify-failure:
    needs: [test, build]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS --retry 3 \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="❌ Tracker build failed (${GITHUB_SHA::7}): $run_url" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
